<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
  <title>냉장고</title>
  <link rel="stylesheet" href="fridge.css">
</head>
<body>
  <div id="app">
    <div class="topbar" title="여기를 잡고 끌어서 옮기기">
      <span class="grip">⠿</span>
      <div class="tools">
        <button data-act="add" title="재료 넣기">＋</button>
        <button data-act="deco" title="냉장고 꾸미기">🎨</button>
        <button data-act="recipes" title="레시피 보기">🍳</button>
        <button data-act="menu" title="메뉴">⋯</button>
      </div>
    </div>

    <div class="fridge">
      <div class="compartment" data-door="fridge">
        <div class="interior fridge-interior">
          <div class="light"></div>
        </div>
        <div class="door" data-door="fridge">
          <div class="door-front">
            <img class="doodle" alt="">
            <div class="stickers"></div>
            <div class="handle"></div>
            <div class="badge"></div>
          </div>
          <div class="door-back"><i></i><i></i><i></i></div>
        </div>
      </div>

      <div class="compartment" data-door="freezer">
        <div class="interior freezer-interior">
          <div class="light"></div>
        </div>
        <div class="door" data-door="freezer">
          <div class="door-front">
            <img class="doodle" alt="">
            <div class="stickers"></div>
            <div class="handle"></div>
            <div class="badge"></div>
          </div>
          <div class="door-back"><i></i><i></i></div>
        </div>
      </div>
    </div>
    <div class="feet"><i></i><i></i></div>

    <form class="modal hidden" autocomplete="off">
      <h3>재료 넣기</h3>
      <label>이름 <small>(쉼표로 여러 개)</small>
        <input name="itemName" required maxlength="60" placeholder="우유, 계란">
      </label>
      <label>칸
        <select name="section"></select>
      </label>
      <label>유통기한
        <input name="expiry" type="date">
      </label>
      <div class="chips">
        <button type="button" data-days="0">오늘</button>
        <button type="button" data-days="3">+3일</button>
        <button type="button" data-days="7">+7일</button>
        <button type="button" data-days="14">+2주</button>
        <button type="button" data-days="30">+1달</button>
        <button type="button" data-days="">없음</button>
      </div>
      <label>메모
        <input name="memo" maxlength="40" placeholder="예: 2개, 반쯤 남음">
      </label>
      <div class="actions">
        <button type="button" class="del">삭제</button>
        <span class="spacer"></span>
        <button type="button" class="cancel">취소</button>
        <button type="submit" class="ok">넣기</button>
      </div>
    </form>

    <div class="toast hidden"><span></span><button type="button">되돌리기</button></div>
  </div>

  <script src="common.js"></script>
  <script src="fridge.js"></script>
</body>
</html>
