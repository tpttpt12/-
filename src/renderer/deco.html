<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
  <title>꾸미기</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="deco.css">
</head>
<body>
  <main class="stage">
    <div class="fridge">
      <div class="door" data-door="fridge">
        <div class="stickers"></div>
        <canvas class="doodle"></canvas>
        <div class="handle"></div>
      </div>
      <div class="door" data-door="freezer">
        <div class="stickers"></div>
        <canvas class="doodle"></canvas>
        <div class="handle"></div>
      </div>
    </div>
    <p class="hint">이미지를 끌어다 놓거나 붙여넣기(Ctrl+V)</p>
  </main>

  <aside class="panel">
    <section>
      <div class="seg" id="tools">
        <button data-tool="move" class="on" title="스티커 옮기기">
          <svg class="ico" viewBox="0 0 12 12"><path d="M3 1.8l6.2 4-2.8.6 1.6 3-1.1.6-1.6-3-2.1 1.9z"/></svg>선택</button>
        <button data-tool="pen" title="펜">
          <svg class="ico" viewBox="0 0 12 12"><path d="M2 10l.7-2.4L8.2 2.1a1.1 1.1 0 0 1 1.6 1.6L4.3 9.2z"/></svg>펜</button>
        <button data-tool="eraser" title="지우개">
          <svg class="ico" viewBox="0 0 12 12"><path d="M4.4 10.2h5.4M2.3 7.6l4.9-4.9a1 1 0 0 1 1.4 0l1.3 1.3a1 1 0 0 1 0 1.4L6.3 9.9H4.6z"/></svg>지우개</button>
      </div>
      <div class="pen-opts">
        <div class="swatches" id="penSwatches"></div>
        <div class="row">
          <input type="range" id="penSize" min="1" max="24" value="3">
          <span class="dotsize"><i id="penDot"></i></span>
        </div>
        <div class="row links">
          <button id="undo">되돌리기</button>
          <button id="clearDoodle">낙서 모두 지우기</button>
        </div>
      </div>
    </section>

    <section>
      <h2>스티커</h2>
      <label class="upload">
        <svg class="ico" viewBox="0 0 12 12"><path d="M6 8V2.2M3.6 4.4L6 2l2.4 2.4M2 8.4v1.4h8V8.4"/></svg>
        이미지 불러오기
        <input type="file" id="file" accept="image/*" multiple hidden>
      </label>
      <div class="row">
        <input id="textSticker" maxlength="14" placeholder="글자 스티커">
        <button id="addText" class="small">추가</button>
      </div>
      <div class="emoji" id="emoji"></div>
    </section>

    <section id="selected" class="disabled">
      <h2>선택한 스티커</h2>
      <label class="row"><span class="k">크기</span><input type="range" id="stSize" min="5" max="120" value="35"></label>
      <label class="row"><span class="k">회전</span><input type="range" id="stRot" min="-180" max="180" value="0"></label>
      <div class="row links">
        <button id="stFront">맨 앞으로</button>
        <button id="stFlip">뒤집기</button>
        <button id="stDelete" class="danger">떼기</button>
      </div>
    </section>

    <section>
      <h2>문 색</h2>
      <div class="swatches big" id="doorSwatches"></div>
      <div class="row custom">
        <label>냉장<input type="color" id="fridgeColor"></label>
        <label>냉동<input type="color" id="freezerColor"></label>
        <label class="check"><input type="checkbox" id="linkDoors" checked>같이</label>
      </div>
      <h2 class="sub">손잡이</h2>
      <div class="swatches" id="handleSwatches"></div>
    </section>

    <footer>
      <button id="clearStickers" class="danger">스티커 모두 떼기</button>
    </footer>
  </aside>

  <script src="common.js"></script>
  <script src="deco.js"></script>
</body>
</html>
